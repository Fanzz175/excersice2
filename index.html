
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AR Dinosaur</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #arjs-video {
      object-fit: contain !important;
    }
  </style>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam;
          facingMode: environment;
          debugUIEnabled: false;
          videoTexture: false;">

    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1"></a-light>

    <a-marker preset="hiro">

      <!-- Dinosaur body -->
      <a-sphere position="0 0.8 0"
        radius="0.45"
        scale="1.4 0.8 0.8"
        color="#39B54A"></a-sphere>

      <!-- Neck and head -->
      <a-cylinder position="0.35 1.15 0"
        radius="0.16" height="0.65"
        color="#39B54A"
        rotation="0 0 -35"></a-cylinder>

      <a-sphere position="0.55 1.45 0"
        radius="0.28" color="#39B54A"></a-sphere>

      <!-- Eye -->
      <a-sphere position="0.62 1.52 0.24"
        radius="0.055" color="white"></a-sphere>
      <a-sphere position="0.64 1.52 0.285"
        radius="0.025" color="black"></a-sphere>

      <!-- Back spikes -->
      <a-cone position="-0.35 1.15 0"
        radius-bottom="0.13" radius-top="0"
        height="0.3" color="#F5A623"></a-cone>
      <a-cone position="-0.1 1.2 0"
        radius-bottom="0.13" radius-top="0"
        height="0.3" color="#F5A623"></a-cone>
      <a-cone position="0.15 1.18 0"
        radius-bottom="0.12" radius-top="0"
        height="0.25" color="#F5A623"></a-cone>

      <!-- Tail -->
      <a-cone position="-0.65 0.8 0"
        radius-bottom="0.25" radius-top="0"
        height="0.65"
        rotation="0 0 90"
        color="#39B54A"></a-cone>

      <!-- Legs -->
      <a-cylinder position="-0.2 0.3 0.22"
        radius="0.12" height="0.4"
        color="#278C37"></a-cylinder>
      <a-cylinder position="0.2 0.3 0.22"
        radius="0.12" height="0.4"
        color="#278C37"></a-cylinder>

      <!-- Arm -->
      <a-cylinder position="0.35 0.85 0.3"
        radius="0.06" height="0.25"
        rotation="0 0 45"
        color="#278C37"></a-cylinder>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
